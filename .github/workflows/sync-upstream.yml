name: Sync Upstream

# 每天检查上游仓库是否有新提交，有就自动合并、验证、提升版本号并触发一次发布。
#
# 设计取舍（都是踩过坑之后的决定）：
#
# 1. **冲突时不硬来**。桌面壳对上游源码有 3 处补丁，上游一旦改动这些文件就可能
#    冲突。脚本会中止合并、保持工作区干净，并开一个 issue 说明冲突文件，
#    而不是留下半个合并状态或强行发布一个坏版本。
#
# 2. **不只看 Git 的退出码**。Git 可能给出"自动合并成功"但结果在语义上是错的
#    （补丁调用的代码被上游挪走了）。所以 scripts/sync-upstream.ps1 在合并后
#    会逐条断言补丁符号仍然存在，缺了就报错退出。
#
# 3. **验证不过就不发布**。合并后跑补丁单元测试与类型检查，任一失败就开 issue。
#    自动发布的前提是自动验证，否则等于把未经检查的代码推给所有用户。
#
# 4. **发布复用同一个发布工作流**，推 tag 触发，避免两套构建逻辑漂移。

on:
  schedule:
    # 每天 20:00 UTC（北京时间次日 04:00）。上游作者多在晚间提交，
    # 这个时间点能让用户早上起来就看到更新。
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      bump:
        description: '版本号提升方式'
        type: choice
        options: [patch, minor, major]
        default: patch
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v4
        with:
          # 显式指定：默认分支改动过，且同步必须落在承载桌面壳的分支上。
          ref: refactor/v3
          fetch-depth: 0
          # 用内置 token 推送合并结果（不需要额外的 PAT）。
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure git identity
        run: |
          git config user.name 'endaxis-sync'
          git config user.email 'endaxis-sync@users.noreply.github.com'

      - name: Sync upstream
        id: sync
        shell: pwsh
        run: |
          ./desktop-shell/scripts/sync-upstream.ps1 -Apply -Bump ${{ inputs.bump || 'patch' }}

      - name: Install frontend dependencies
        if: steps.sync.outputs.synced == 'true'
        run: npm ci --no-audit --no-fund

      - name: Verify desktop-shell patches still hold
        if: steps.sync.outputs.synced == 'true'
        run: npx vitest run src/ui/timeline/projectFileSession.test.ts

      - name: Type-check
        if: steps.sync.outputs.synced == 'true'
        run: npx vue-tsc --noEmit --project tsconfig.app.json --incremental false

      - name: Push merged branch
        if: steps.sync.outputs.synced == 'true'
        run: |
          git push origin HEAD:refactor/v3
          # 同时把默认分支 main 快进到同一提交。
          # 原因：GitHub 的定时任务**只从默认分支加载工作流**，而本仓库默认分支是
          # main。工作流只存在于 refactor/v3 时，它不会被调度——这正是第一次上线后
          # "从来没跑过"的根本原因（tag 触发的发布不受影响，所以那个一直正常）。
          git push origin HEAD:main

      - name: Publish release for the synced version
        if: steps.sync.outputs.synced == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: pwsh
        run: |
          if ("${{ secrets.GH_TOKEN }}" -eq '') {
            # 没有 PAT 也能同步，只是不发版。这不是错误，但要让人知道。
            Write-Host '::warning::未配置 GH_TOKEN，本次只同步代码，未发布 Release'
            exit 0
          }
          $version = '${{ steps.sync.outputs.next }}'
          git tag "desktop-v$version"
          # 必须用 PAT 推 tag：GITHUB_TOKEN 推送产生的 push 事件**不会触发其它工作流**
          # （GitHub 防递归），而发布工作流正是靠 tag 推送启动的。
          # 首次上线就踩到了：tag 推出去了，Release 却从未开始构建。
          $remote = "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git"
          git push $remote "desktop-v$version"
          Write-Host "已推送 tag desktop-v$version，发布工作流将接手构建。"

      - name: Open issue when sync needs a human
        if: failure() && steps.sync.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            // 用 github-script 而不是 gh CLI：
            //   - 不依赖 runner 上有没有 gh，也不受 shell 差异影响；
            //   - 不需要一个可能不存在的 label（原实现用 --label 'sync' 直接失败）；
            //   - 第一次真实运行时这一步就失败了，导致「同步失败」只留下一个红叉、
            //     没有任何说明。告警机制本身失效比故障更糟，所以这里要最简单可靠。
            const marker = '上游同步需要人工处理';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '自动同步上游失败，**未发布任何版本**。',
              '',
              `失败日志：${runUrl}`,
              '',
              '### 常见原因与处理',
              '',
              '- **上游改动了桌面壳补丁所在文件**（`src/ui/timeline/projectFileSession.ts` /
              '  `src/ui/timeline/TimelineEditor.vue`）产生冲突。脚本已中止合并并保持工作区干净，',
              '  不会发布半成品。',
              '- **补丁符号消失**：Git 自动合并成功，但上游挪走了补丁依赖的代码。',
              '- **验证未通过**：补丁单元测试或类型检查失败。',
              '',
              '### 处理方式',
              '',
              '本地复现同一套逻辑：',
              '',
              '```powershell',
              'pwsh -File desktop-shell/scripts/sync-upstream.ps1 -Apply',
              '```',
              '',
              '若冲突属于「上游把某个函数搬到新模块」这类形状，可用解析脚本只做减法：',
              '',
              '```',
              'node desktop-shell/scripts/resolve-sync-conflict.mjs src/ui/timeline/projectFileSession.ts',
              '```',
              '',
              '它只删除已被搬走的定义并改导入，找不到边界会拒绝执行，不会瞎删补丁。',
            ].join('\n');

            // 只维护一个跟踪 issue：已存在就追加评论，而不是每天开一个新的。
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find(issue => issue.title === marker);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`已在现有 issue #${existing.number} 追加评论`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: marker,
                body,
              });
              core.info(`已创建 issue #${created.data.number}`);
            }